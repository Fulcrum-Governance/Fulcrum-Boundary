name: Release

# Tag-gated release pipeline. Nothing here runs on branch pushes or PRs.
#
# On a `v*` tag push it:
#   1. runs the full `make release-check` gate;
#   2. builds the universal static (CGO_ENABLED=0) matrix with goreleaser,
#      publishes the GitHub release with SHA256SUMS, the evidence-bundle
#      tarball, the container images, and pushes the Homebrew cask to
#      fulcrum-governance/homebrew-tap (requires the HOMEBREW_TAP_GITHUB_TOKEN
#      repo secret: a token with write access to that tap repo);
#   3. builds the native-cgo full-SQL-classifier binaries per runner and
#      uploads them to the same release with a `_cgo` suffix plus a
#      SHA256SUMS-cgo manifest.
#
# A no-input `workflow_dispatch` is a dry-run: goreleaser runs in snapshot mode
# (publishing skipped), the cgo matrix builds, and everything lands as workflow
# artifacts only. Supplying all recovery inputs validates an existing annotated
# root SemVer tag and its peeled commit before the normal publication path runs.
#
# Variant truth (see .goreleaser.yaml and docs/INSTALL.md): static binaries
# cannot classify SQL (the Postgres AST classifier links pg_query_go via cgo),
# so routed SQL classifies UNKNOWN and the Postgres guard denies it
# fail-closed; `_cgo` binaries carry the full classifier. Windows `_cgo`
# binaries are not produced — a permanent stance, by design: the cgo classifier
# needs a C/MSYS2 toolchain the Windows release path does not carry, and a
# Windows-cgo lane is not planned. Windows users get the static variant (routed
# SQL denied fail-closed). See docs/INSTALL.md "Static Vs Cgo Builds". The
# cgo-binaries matrix below is darwin/linux only by design; a drift test
# (tests/releasebuild/) pins it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated root SemVer tag to republish
        required: false
        type: string
      expected_commit:
        description: Full commit SHA to which the release tag must peel
        required: false
        type: string
      expected_tag_object:
        description: Full annotated-tag object SHA expected for the release tag
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-target:
    name: validate exact release target
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.target.outputs.publish }}
      release_tag: ${{ steps.target.outputs.release_tag }}
      release_sha: ${{ steps.target.outputs.release_sha }}
      tag_object: ${{ steps.target.outputs.tag_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate annotated root release tag and exact commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_TAG_OBJECT: ${{ inputs.expected_tag_object }}
          PUSH_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$DISPATCH_TAG" ] && [ -z "$EXPECTED_COMMIT" ] && [ -z "$EXPECTED_TAG_OBJECT" ]; then
              # A no-input dispatch is deliberately snapshot-only. It has no
              # release tag and cannot reach a publishing condition below.
              {
                echo 'publish=false'
                echo 'release_tag=v0.0.0-snapshot'
                echo "release_sha=$WORKFLOW_SHA"
                echo 'tag_object='
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$DISPATCH_TAG" ] || [ -z "$EXPECTED_COMMIT" ] || [ -z "$EXPECTED_TAG_OBJECT" ]; then
              echo '::error::recovery publication requires release_tag, expected_commit, and expected_tag_object'
              exit 1
            fi
            tag="$DISPATCH_TAG"
            expected_commit="$EXPECTED_COMMIT"
            expected_tag_object="$EXPECTED_TAG_OBJECT"
          else
            tag="${PUSH_REF#refs/tags/}"
            # Bind a tag-push release to the immutable event target, not a
            # value resolved from the fetched tag that could have moved.
            expected_commit="$WORKFLOW_SHA"
            expected_tag_object=''
          fi

          case "$tag" in
            *'/'*) echo '::error::release tag must be a root tag, not a nested component tag'; exit 1 ;;
          esac
          # SemVer 2.0.0 with a required leading v: core numeric identifiers
          # and numeric prerelease identifiers have no leading zeroes; every
          # prerelease/build identifier is nonempty.
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if ! printf '%s\n' "$tag" | grep -Eq "$semver_re"; then
            echo '::error::release tag must be a strict root SemVer 2.0.0 tag (vMAJOR.MINOR.PATCH)'
            exit 1
          fi
          if ! printf '%s\n' "$expected_commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo '::error::expected_commit must be a full 40-character lowercase commit SHA'
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
            && ! printf '%s\n' "$expected_tag_object" | grep -Eq '^[0-9a-f]{40}$'; then
            echo '::error::expected_tag_object must be a full 40-character lowercase annotated-tag object SHA'
            exit 1
          fi

          tag_ref="refs/tags/$tag"
          tag_object="$(git rev-parse "$tag_ref")"
          if [ "$(git cat-file -t "$tag_object")" != 'tag' ]; then
            echo '::error::release tag must be annotated; lightweight tags cannot be recovered'
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$tag_object" != "$expected_tag_object" ]; then
            echo '::error::release tag object does not match expected_tag_object'
            exit 1
          fi
          release_sha="$(git rev-parse "${tag_ref}^{}")"
          if [ "$(git cat-file -t "$release_sha")" != 'commit' ]; then
            echo '::error::release tag must peel to a commit'
            exit 1
          fi
          if [ "$release_sha" != "$expected_commit" ]; then
            echo '::error::release tag peeled commit does not match expected_commit'
            exit 1
          fi
          {
            echo 'publish=true'
            echo "release_tag=$tag"
            echo "release_sha=$release_sha"
            echo "tag_object=$tag_object"
          } >> "$GITHUB_OUTPUT"

  release-check:
    name: release-check gate
    needs: release-target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-target.outputs.release_sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: make release-check
        run: make release-check

  goreleaser:
    name: static matrix + release publish
    needs: [release-target, release-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      packages: write # push container images to ghcr.io
      id-token: write # mint the OIDC token for build-provenance attestation
      attestations: write # record the provenance attestation
    env:
      GORELEASER_CURRENT_TAG: ${{ needs.release-target.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-target.outputs.release_sha }}
          fetch-depth: 0 # goreleaser changelog needs history and tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      # goreleaser execs `syft` from PATH to generate the SPDX SBOMs (see the
      # sboms block in .goreleaser.yaml). Neither ubuntu-latest nor
      # goreleaser-action provides syft, so install it here — before BOTH the
      # tag `release --clean` and the dispatch `release --clean --snapshot`
      # steps, and NOT tag-gated, so the dry-run path has it too.
      - name: Install syft for SBOM generation
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to ghcr.io
        if: needs.release-target.outputs.publish == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Preflight tap token (tag publish)
        if: needs.release-target.outputs.publish == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is empty or unset; the Homebrew cask push would fail after the full build. Set the repo secret and re-run."
            exit 1
          fi
      - name: Build evidence bundle (local-only, fixture-safe)
        run: |
          go run ./cmd/boundary evidence bundle --include-demo --out .release-extras/boundary-evidence
          go run ./cmd/boundary evidence verify .release-extras/boundary-evidence
          tar -czf .release-extras/boundary-evidence.tar.gz -C .release-extras boundary-evidence
      - name: goreleaser release (tag)
        if: needs.release-target.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Attest build provenance for static release artifacts (tag)
        if: needs.release-target.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The static archives, their SPDX SBOMs, and the checksum manifest
          # produced by goreleaser in dist/. Build provenance for the release
          # distribution; distinct from runtime decision-record signing (#134).
          subject-path: |
            dist/*_static-nocgo.tar.gz
            dist/*_static-nocgo.zip
            dist/*.spdx.json
            dist/SHA256SUMS
            .release-extras/boundary-evidence.tar.gz
      - name: goreleaser snapshot dry-run (manual dispatch)
        if: needs.release-target.outputs.publish != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload snapshot artifacts (manual dispatch)
        if: needs.release-target.outputs.publish != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-snapshot
          path: |
            dist/*_static-nocgo.*
            dist/SHA256SUMS
          retention-days: 7

  cgo-binaries:
    name: cgo ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [release-target, goreleaser]
    permissions:
      contents: write # upload assets to the release created by goreleaser
      id-token: write # mint the OIDC token for build-provenance attestation
      attestations: write # record the provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            native: true
          # cgo cross-arch on macOS: the darwin toolchain drives clang with
          # -arch x86_64, so the amd64 slice builds on the arm64 runner.
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            native: false
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            native: true
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            native: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-target.outputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: Install syft for SBOM generation
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ needs.release-target.outputs.release_tag }}
        run: |
          tag="$RELEASE_TAG"
          {
            echo "tag=${tag}"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"
      - name: Build native-cgo binary (full SQL classifier)
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/fulcrum-governance/fulcrum-boundary/internal/versioninfo.Version=${{ steps.version.outputs.tag }} \
              -X github.com/fulcrum-governance/fulcrum-boundary/internal/versioninfo.Commit=${{ needs.release-target.outputs.release_sha }} \
              -X github.com/fulcrum-governance/fulcrum-boundary/internal/versioninfo.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o build-cgo/boundary ./cmd/boundary
      - name: Assert the binary really is the cgo variant
        run: |
          go version -m build-cgo/boundary | grep -E 'CGO_ENABLED=1' \
            || { echo "binary was not built with cgo; refusing to ship it as _cgo"; exit 1; }
      - name: Run selftest on native binaries
        if: matrix.native
        run: |
          ./build-cgo/boundary version
          ./build-cgo/boundary selftest
      - name: Package archive
        id: package
        run: |
          name="boundary_${{ steps.version.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}_cgo"
          staging="dist-cgo/${name}"
          mkdir -p "${staging}"
          cp build-cgo/boundary LICENSE README.md LIMITATIONS.md "${staging}/"
          cp docs/INSTALL.md "${staging}/INSTALL.md"
          tar -czf "dist-cgo/${name}.tar.gz" -C dist-cgo "${name}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist-cgo && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          else
            (cd dist-cgo && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi
          # SPDX SBOM for the cgo archive (BND-CLAIM-DIST-002). The static
          # archives are SBOM'd by goreleaser; the cgo archives are built outside
          # goreleaser, so syft runs here, matching format.
          syft "dist-cgo/${name}.tar.gz" --output "spdx-json=dist-cgo/${name}.tar.gz.spdx.json"
          {
            echo "archive=dist-cgo/${name}.tar.gz"
            echo "checksum=dist-cgo/${name}.tar.gz.sha256"
            echo "sbom=dist-cgo/${name}.tar.gz.spdx.json"
          } >> "$GITHUB_OUTPUT"
      - name: Upload to the GitHub release (tag)
        if: needs.release-target.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-target.outputs.release_tag }}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.sbom }}" --clobber
      - name: Attest build provenance for the cgo archive + SBOM (tag)
        if: needs.release-target.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.sbom }}
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cgo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.sbom }}
          retention-days: 7

  cgo-checksums:
    name: SHA256SUMS-cgo
    needs: [release-target, cgo-binaries]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-target.outputs.release_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cgo-*
          merge-multiple: true
      - name: Assemble SHA256SUMS-cgo
        run: |
          cat ./*.tar.gz.sha256 | sort -k2 > SHA256SUMS-cgo
          cat SHA256SUMS-cgo
      - name: Upload to the GitHub release (tag)
        if: needs.release-target.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-target.outputs.release_tag }}" SHA256SUMS-cgo --clobber --repo "${GITHUB_REPOSITORY}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS-cgo
          path: SHA256SUMS-cgo
          retention-days: 7
