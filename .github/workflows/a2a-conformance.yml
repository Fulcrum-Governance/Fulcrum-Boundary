name: A2A Live Conformance
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run A2A Live Conformance Tests
        run: |
          cd tests/adapter_conformance/a2a_server
          npm install
          cd ../../../
          go test ./tests/adapter_conformance/ -run TestA2ALiveConformance -v
